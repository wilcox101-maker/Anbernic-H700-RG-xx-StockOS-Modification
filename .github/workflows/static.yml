name: static

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: README markdownlint
        run: npm ci && npm run lint:readme
      - name: Syntax and document checks
        run: bash scripts/static_check.sh
      - name: Device-free regression tests
        run: python3 -m unittest discover -s tests -v
